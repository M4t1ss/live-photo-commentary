[package]
name = "kokoro-timestamped"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
futures = "0.3.34"
hf-hub = "1.0.0"
log = "0.4.34"
lzma-rs = "0.3.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ruzstd = "0.9.0"
serde_json = "1.0.151"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "macros", "rt"] }
unicode-normalization = "0.1.25"
vibrato = { version = "0.5.2", default-features = false }

[dev-dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
hound = "3.5.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
