# VLM model catalogue.
#
# Each provider section lists available models. Entries can be a plain string
# (model name/ID) or an object with optional kwargs:
#
#   - name: org/model-id
#     display_name: Human-readable label   # optional, defaults to name
#     processor_kwargs:                    # optional, passed to AutoProcessor.from_pretrained
#       max_pixels: 262144
#     model_kwargs:                        # optional, passed to from_pretrained
#       quantization_config: null          # e.g. disable auto 4-bit for this model
#     generation_kwargs:                   # optional, passed to model.generate
#       max_new_tokens: 150
#     response_re: '...'                   # optional, picks 'text' group or 1st group from response
#
# Cloud
gemini:
  - gemini-3.6-flash
  - gemini-3.5-flash
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
openai:
  - gpt-4o
  - gpt-4o-mini

# Local
local:
  - microsoft/Phi-4-multimodal-instruct
  - google/gemma-3-4b-it
  - google/gemma-3-12b-it
  - google/gemma-4-E2B-it
  - google/gemma-4-E4B-it
  - google/gemma-4-31B-it
  - google/gemma-4-12B-it
  - Qwen/Qwen2.5-VL-3B-Instruct
  - Qwen/Qwen2.5-VL-7B-Instruct
  - Qwen/Qwen3-VL-2B-Instruct
  - Qwen/Qwen3-VL-4B-Instruct
  - Qwen/Qwen3-VL-8B-Instruct
  - Qwen/Qwen3-VL-32B-Instruct
  - OpenGVLab/InternVL3_5-1B-Instruct
  - OpenGVLab/InternVL3_5-2B-Instruct
  - OpenGVLab/InternVL3_5-4B-Instruct
  - OpenGVLab/InternVL3_5-8B-Instruct
  - OpenGVLab/InternVL3_5-14B-Instruct
  - OpenGVLab/InternVL3_5-38B-Instruct
  - apple/FastVLM-0.5B
  - apple/FastVLM-1.5B
  - apple/FastVLM-7B
  - name: meta-models/Muse-Glimmer-30B
    generation_kwargs:
        temperature: 1.0
        top_p: 0.95
        top_k: 64
        max_new_tokens: 10000
    response_re: '<\|start\|>assistant to=user<\|message\|>(.*?)$'
