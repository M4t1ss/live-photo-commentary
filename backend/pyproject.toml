[project]
name = "live-photo-commentary-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.136.3",
  "mss>=10.2.0",
  "pillow>=12.2.0",
  "pydantic-settings>=2.14.1",
  "scikit-image>=0.26.0",
  "uvicorn[standard]>=0.48.0",
  "websockets>=16.0",
  "huggingface-hub>=1.17.0",
  "misaki[en,ja]>=0.9.4",
  "onnxruntime>=1.26.0",
  "semantic-text-splitter>=0.30.1",
  "imagehash>=4.3.2",
  "torch",
  "torchvision",
  "transformers",
  "accelerate",
  "timm>=1.0.27",
]

[dependency-groups]
cloud = ["openai", "google-generativeai", "elevenlabs"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2"]

[tool.uv.sources]
# On Windows and Linux, install the CUDA 12.4 builds (works with any driver
# supporting CUDA 12.4+, falls back to CPU if no GPU present).
# macOS gets CPU builds from PyPI, which include MPS support.
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true  # only used for packages listed in [tool.uv.sources]

[tool.pytest.ini_options]
asyncio_mode = "auto"
