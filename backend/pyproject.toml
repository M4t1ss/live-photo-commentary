[project]
name = "live-photo-commentary-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "mss>=10.2.0",
  "pillow>=12.2.0",
  "pydantic-settings>=2.14.1",
  "scikit-image>=0.26.0",
  "uvicorn[standard]>=0.48.0",
  "websockets>=16.0",
  "huggingface-hub>=1.17.0",
  "misaki[en,ja]>=0.9.4",
  "onnxruntime>=1.26.0",
]

[dependency-groups]
cloud = ["openai", "google-generativeai", "elevenlabs"]
local = ["torch", "transformers"]
