[project]
name = "live-photo-commentary-backend"
version = "0.1.6"
requires-python = ">=3.12, <3.13"
dependencies = [
  "fastapi>=0.136.3",
  "pillow>=12.2.0",
  "pydantic-settings>=2.14.1",
  "scikit-image>=0.26.0",
  "uvicorn[standard]>=0.48.0",
  "websockets>=16.0",
  "huggingface-hub>=1.17.0",
  "misaki[en,ja]>=0.9.4",
  "onnxruntime>=1.26.0",
  "semantic-text-splitter>=0.30.1",
  "imagehash>=4.3.2",
  "pyyaml>=6.0",
  "regex>=2024.11.6",
  "torch",
  "torchvision",
  "transformers",
  "accelerate",
  "timm>=1.0.27",
  "openai",
  "google-genai",
]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2"]

# Standard PyPI torch (~250 MB): CPU everywhere, MPS on Apple Silicon.
# NVIDIA users who want CUDA acceleration can reinstall after setup:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124

[tool.pytest.ini_options]
asyncio_mode = "auto"
