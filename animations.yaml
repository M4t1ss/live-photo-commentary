triggers:
  - regex: '\b(?:hello|greet\w+|wav(?:ing|es?))\b'
    animations:
      - hello
      - waving
  - regex: '\b(?:point|that)\b'
    animations:
      - pointing
  - regex: '\b(?:explain\w*)\b'
    animations:
      - explain
  - regex: '\b(?:cool|awesome|support\w*)\b'
    animations:
      - cool
  - regex: '\b(?:agree\w*|salut\w*)\b'
    animations:
      - saluting
  - regex: '\b(?:disagree\w*|dislik\w*)\b'
    animations:
      - disagree
  - regex: '\b(?:scar\w+|creep\w*|fright\w*|spook\w*)\b'
    animations:
      - scary
      - surprised
  - regex: '\b(?:love|cute|nice|like)\b'
    animations:
      - lovely
  - regex: '\b(?:stop|enough)\b'
    animations:
      - stop
  - regex: '\b(?:interest\w*|think|thought|wonder\w*)\b'
    animations:
      - interesting
  - regex: '\b(?:happy|cheer\w*|inspir\w*)\b'
    animations:
      - happy
  - regex: '\b(?:angry|upset\w*|anger)\b'
    animations:
      - angry
  - regex: '\b(?:confus\w*|what\?)\b'
    animations:
      - confused
buttons:
  - label: Wave
    animations:
      - hello
  - label: Look
    animations:
      - looking
  - label: Dance
    animations:
      - dancing
  - label: Wait
    animations:
      - waiting
system:
  blank:
    animations:
      - blank
  waiting:
    animations:
      - waiting
  start:
    animations:
      - walk-on
  stop:
    animations:
      - walk-off
