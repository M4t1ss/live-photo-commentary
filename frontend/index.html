<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Photo Commentary</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.176.0",
      "three/addons/": "https://esm.sh/three@0.176.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
      "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="main">
    <div id="left-panel">
      <div id="avatar-area">
        <canvas id="avatar-canvas"></canvas>
        <div id="cuda-banner" class="hidden">
          <span id="cuda-banner-msg"></span>
          <div id="cuda-banner-btns">
            <button id="cuda-install-btn">Install</button>
            <button id="cuda-dismiss-btn">Not now</button>
          </div>
        </div>
        <div id="subtitle"></div>
      </div>
      <div id="player-bar">
        <div id="bar-left">
          <button id="start-stop" title="Start" disabled>&#9205;</button>
          <button id="bar-mute" title="Mute">&#128266;</button>
          <input type="range" id="bar-volume" min="0" max="1" step="0.05" />
        </div>
        <div id="bar-right">
          <button id="toggle-subtitle" class="active" title="Toggle subtitles">CC</button>
          <button id="settings-btn" title="Settings" disabled>&#9881;</button>
        </div>
      </div>
      <div id="subtitle-row-divider"></div>
      <div id="subtitle-panel"></div>
    </div>
    <div id="divider"></div>
    <div id="right-panel">
      <img id="current-frame" class="hidden" alt="Current frame" />
      <img id="prev-frame" class="hidden" alt="Previous frame" />
      <div id="diff-info" class="hidden"></div>
      <div id="status-bar">
        <span id="status-phase">Idle</span>
        <span id="status-timer"></span>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h2>Settings</h2>

      <div id="modal-tabs">
        <button class="tab-btn active" data-tab="llm">LLM</button>
        <button class="tab-btn" data-tab="capture">Capture</button>
        <button class="tab-btn" data-tab="ui">UI</button>
        <button class="tab-btn" data-tab="prompts">Prompts</button>
      </div>

      <div id="modal-body">
      <div id="tab-llm">
      <section>
        <h3>Vision model</h3>
        <label>Provider
          <select id="cfg-vlm-provider">
            <option value="gemini">Gemini</option>
            <option value="openai">OpenAI</option>
            <option value="local">Local</option>
          </select>
        </label>
        <label>Model
          <div class="combo" id="vlm-model-combo">
            <input id="cfg-vlm-model" type="text" placeholder="model id" autocomplete="off" spellcheck="false" />
            <ul id="vlm-model-dropdown" class="combo-dropdown hidden"></ul>
          </div>
        </label>
        <details id="vlm-overrides-details">
          <summary>Model overrides (JSON)</summary>
          <textarea id="cfg-vlm-model-overrides" spellcheck="false" placeholder='{"generation_kwargs": {"max_new_tokens": 200}}'></textarea>
        </details>
        <label>Endpoint URL
          <input type="text" id="cfg-openai-base-url" placeholder="https://…/v1" autocomplete="off" spellcheck="false" />
        </label>
        <label>Endpoint API key
          <input type="password" id="cfg-openai-compat-key" autocomplete="off" />
        </label>
      </section>

      <section>
        <h3>API keys</h3>
        <label>Gemini
          <input type="password" id="cfg-gemini-key" placeholder="unchanged" autocomplete="off" />
        </label>
        <label>OpenAI
          <input type="password" id="cfg-openai-key" placeholder="unchanged" autocomplete="off" />
        </label>
      </section>

      <section>
        <h3>History</h3>
        <label>Max history size
          <input type="number" id="cfg-max-history" step="1" min="0" />
        </label>
      </section>

      </div><!-- #tab-llm -->

      <div id="tab-capture" class="hidden">
      <section>
        <h3>Capture</h3>
        <label>Monitor
          <select id="cfg-monitor">
            <option value="0">Default monitor</option>
          </select>
        </label>
        <div id="clip-region-row">
          <span>Region</span>
          <div id="clip-inputs">
            <input type="number" id="cfg-clip-x" placeholder="X" min="0" title="Left edge (px)" />
            <input type="number" id="cfg-clip-y" placeholder="Y" min="0" title="Top edge (px)" />
            <input type="number" id="cfg-clip-w" placeholder="W" min="1" title="Width (px)" />
            <input type="number" id="cfg-clip-h" placeholder="H" min="1" title="Height (px)" />
          </div>
          <div id="clip-btns">
            <button id="cfg-pick-region">Pick&hellip;</button>
            <button id="cfg-clear-clip">Clear</button>
          </div>
        </div>
      </section>

      <section>
        <h3>Timing</h3>
        <label>Screenshot delay (s)
          <input type="number" id="cfg-pre-screenshot-delay" step="0.5" min="0" />
        </label>
      </section>

      <section>
        <h3>Difference filter</h3>
        <label>Threshold
          <input type="number" id="cfg-diff-threshold" step="0.001" min="0" />
        </label>
        <label>Measure
          <select id="cfg-diff-measure">
            <option value="mse">MSE</option>
            <option value="ssim">SSIM</option>
            <option value="average_hash">Average hash</option>
            <option value="phash">Perceptual hash</option>
            <option value="phash_simple">Perceptual hash (simple)</option>
            <option value="dhash">Difference hash</option>
            <option value="dhash_vertical">Difference hash (vertical)</option>
            <option value="whash">Wavelet hash</option>
            <option value="colorhash">Color hash</option>
          </select>
        </label>
      </section>

      </div><!-- #tab-capture -->

      <div id="tab-ui" class="hidden">
      <section>
        <h3>Audio</h3>
        <label>Voice
          <div class="combo" id="tts-voice-combo">
            <input id="cfg-tts-voice" type="text"
                   placeholder='af_heart  or  {"af_nicole":0.8,"jf_alpha":0.2}' autocomplete="off" spellcheck="false" />
            <ul id="tts-voice-dropdown" class="combo-dropdown hidden"></ul>
          </div>
        </label>
        <label>Volume
          <div id="volume-row">
            <input type="range" id="cfg-volume" min="0" max="1" step="0.05" />
            <span id="cfg-volume-pct"></span>
          </div>
        </label>
      </section>

      <section>
        <h3>Appearance</h3>
        <label>Background
          <div class="color-row">
            <div class="color-preview" id="cfg-bg-preview"></div>
            <input type="text" id="cfg-bg-color" class="mono" maxlength="7" placeholder="#000000" spellcheck="false" />
          </div>
        </label>
        <label>Subtitle color
          <div class="color-row">
            <div class="color-preview" id="cfg-fg-preview"></div>
            <input type="text" id="cfg-fg-color" class="mono" maxlength="7" placeholder="#ffffff" spellcheck="false" />
          </div>
        </label>
        <label>Separated subtitles
          <input type="checkbox" id="cfg-subtitle-mode" />
        </label>
        <label>Subtitle vertical position
          <div class="slider-row">
            <input type="range" id="cfg-subtitle-vpos" min="0" max="100" step="1" />
            <input type="number" id="cfg-subtitle-vpos-num" min="0" max="100" step="1" class="mono" />
          </div>
        </label>
        <label>Subtitle font size (px)
          <input type="number" id="cfg-subtitle-font" min="8" max="48" step="1" />
        </label>
        <label>Subtitle lines (0 = one word)
          <input type="number" id="cfg-subtitle-lines" min="0" max="6" step="1" />
        </label>
        <label>Highlight spoken word
          <input type="checkbox" id="cfg-highlight-enabled" />
        </label>
        <label>Highlight color
          <div class="color-row">
            <div class="color-preview" id="cfg-hl-preview"></div>
            <input type="text" id="cfg-hl-color" class="mono" maxlength="7" placeholder="#4a9eff" spellcheck="false" />
          </div>
        </label>
      </section>

      </div><!-- #tab-ui -->

      <div id="tab-prompts" class="hidden">
        <section>
          <h3>Prompt set</h3>
          <div id="promptset-row">
            <div id="promptset-combo">
              <input id="cfg-promptset" type="text" placeholder="default" autocomplete="off" spellcheck="false" />
              <button id="promptset-combo-btn" tabindex="-1">&#9662;</button>
              <ul id="promptset-dropdown" class="combo-dropdown hidden"></ul>
            </div>
            <div id="promptset-btns">
              <button id="promptset-load">Load</button>
              <button id="promptset-save">Save</button>
              <button id="promptset-delete">Delete</button>
            </div>
          </div>
        </section>
        <section>
          <label class="prompt-label"><span>System prompt</span><textarea id="cfg-system-prompt" rows="4"></textarea></label>
          <label class="prompt-label"><span>Prompt</span><textarea id="cfg-prompt" rows="5"></textarea></label>
          <label class="prompt-label"><span>First prompt</span><textarea id="cfg-first-prompt" rows="3"></textarea></label>
          <label class="prompt-label"><span>History prompt</span><textarea id="cfg-history-prompt" rows="2"></textarea></label>
          <label class="prompt-label"><span>Compact prompt</span><textarea id="cfg-compact-prompt" rows="3"></textarea></label>
        </section>
      </div><!-- #tab-prompts -->
      </div><!-- #modal-body -->

      <div id="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="picker-overlay" class="hidden">
    <div id="picker-modal">
      <div id="picker-header">
        <h2>Pick Capture Region</h2>
        <div id="picker-zoom-controls">
          <button id="picker-zoom-out" title="Zoom out">&#8722;</button>
          <span id="picker-zoom-level">100%</span>
          <button id="picker-zoom-in" title="Zoom in">+</button>
          <button id="picker-fit-btn" title="Fit to window">Fit</button>
        </div>
      </div>
      <div id="picker-canvas-wrap">
        <canvas id="picker-canvas"></canvas>
        <div id="picker-loading">Capturing screen&hellip;</div>
      </div>
      <div id="picker-footer">
        <span id="picker-cursor-pos" class="mono">&#8212;</span>
        <div id="picker-inputs">
          <span class="pi-label">X</span><input type="number" id="pi-x" min="0" />
          <span class="pi-label">Y</span><input type="number" id="pi-y" min="0" />
          <span class="pi-label">W</span><input type="number" id="pi-w" min="1" />
          <span class="pi-label">H</span><input type="number" id="pi-h" min="1" />
        </div>
        <div id="picker-footer-btns">
          <button id="picker-cancel">Cancel</button>
          <button id="picker-apply">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <div id="splash">
    <div id="splash-title">Live Photo Commentary</div>
    <div class="splash-spinner"></div>
    <div id="splash-status">Starting up…</div>
    <button id="splash-restart-btn" class="hidden">Restart Backend</button>
  </div>

  <script src="lipsync.js"></script>
  <script src="subtitles.js"></script>
  <script src="app.js"></script>
  <script type="module" src="avatar.js"></script>
</body>
</html>
