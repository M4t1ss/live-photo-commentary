# Config for `cargo about`, which lists the licences of the Rust libraries the app
# is built from (see src-tauri/LICENSES/THIRD-PARTY-LICENSES.html). Regenerate
# after changing dependencies (on Windows the licence texts bring CRLF line endings
# along; convert the output to LF, which this repository uses):
#
#   cargo about generate --manifest-path src-tauri/Cargo.toml about.hbs -o src-tauri/LICENSES/THIRD-PARTY-LICENSES.html
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# Every platform the installers are built for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Dev and build dependencies aren't in the installer.
ignore-dev-dependencies = true
ignore-build-dependencies = true
