name: Build

# Not yet run on GitHub: written on Windows, where only the Windows legs of
# this could be tried by hand (see RUSTIFICATION.md, phase 7). Expect to fix
# things here on the first runs.

on:
  push:
    branches: [rustification, main]
    tags: ["v*"]
  pull_request:
    branches: [rustification, main]

jobs:
  # The CUDA backend is a separate download (Settings > GPU acceleration), so
  # it is built apart from the installers: only the library, not the app. The
  # installers are built with its checksum, and the archive goes to the release
  # the app downloads it from.
  cuda-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows
          - platform: ubuntu-24.04
            os: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # llama.cpp's Vulkan build has a file whose path exceeds MSVC's 260
      # characters when Cargo's intermediate files are in the checkout (see
      # RUSTIFICATION.md, "Windows path length"). Cargo 1.91+ puts them in a
      # short folder instead.
      - name: Use a short build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CARGO_BUILD_BUILD_DIR=C:\b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'

      # Only llama.cpp is built here, not the app, so none of the app's GUI and
      # screen-capture libraries are needed.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-directories: ${{ runner.os == 'Windows' && 'C:\b' || '' }}
          key: cuda
          # The CUDA build takes over an hour: keep what was compiled when a later
          # step fails, so that the next run starts from there.
          cache-on-failure: true

      # The toolkit has to be 13.x: the archive ships cublas64_13 / libcublas.so.13.
      # Windows: the runner's Visual Studio is 2026 (version 18), which CUDA
      # supports from 13.2 on (13.0 and 13.1: Visual Studio 2022 and older, and
      # CMake then fails with "No CUDA toolset found"). The full installer,
      # because the sub-package names of a partial install are guesswork (and
      # visual_studio_integration is needed to compile CUDA with MSVC).
      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          method: local

      # Linux: the same release as Windows, from NVIDIA's own repository as in their
      # install instructions. (The action's partial installs only work with its
      # `cuda-` package names, which cuBLAS doesn't have.) `cuda-toolkit-13-2` is
      # the toolkit without the driver.
      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-13-2
          echo "CUDA_PATH=/usr/local/cuda-13.2" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-13.2/bin" >> "$GITHUB_PATH"

      - name: Build and package the CUDA backend
        shell: bash
        run: cargo xtask package-cuda-backend dist --release

      - uses: actions/upload-artifact@v7
        with:
          name: cuda-backend-${{ matrix.os }}
          path: |
            dist/cuda-backend-${{ matrix.os }}-x64.zip
            dist/cuda-backend-${{ matrix.os }}-x64.zip.sha256
          if-no-files-found: error

  build:
    needs: cuda-backend
    # Installers are built even if the (very long) CUDA job failed, so that one
    # failure doesn't hide the results of the other jobs; they just can't offer
    # the CUDA download then. The release job still needs everything to succeed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            cuda-os: windows
            features: dynamic-backends,vulkan
            gpu-backend: vulkan
          - platform: ubuntu-24.04
            cuda-os: linux
            features: dynamic-backends,vulkan
            gpu-backend: vulkan
          - platform: macos-latest
            cuda-os: ""
            features: dynamic-backends,metal
            gpu-backend: metal

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Use a short build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CARGO_BUILD_BUILD_DIR=C:\b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang libclang-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev libegl-dev libwayland-dev libxcb1-dev libxrandr-dev \
            spirv-headers \
            patchelf \
            gcc-mingw-w64-x86-64

      # llama.cpp's Vulkan backend needs the Vulkan headers, the loader and the
      # shader compiler (glslc). These steps are the ones llama.cpp's own CI uses.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Not older than 1.4.363.0: llama.cpp's Vulkan backend needs the SDK's
          # SPIRV-Headers CMake package, which 1.4.309.0 lacks (1.4.363.0 is also
          # what the installer was developed and tested with).
          VULKAN_VERSION: 1.4.363.0
        run: |
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" -OutFile "$env:TEMP\vulkan.exe"
          Start-Process "$env:TEMP\vulkan.exe" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_VERSION\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # The runner image has LLVM; bindgen needs to be told where.
      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-screenshot -> target
          cache-directories: ${{ runner.os == 'Windows' && 'C:\b' || '' }}
          # The Windows cache saved by the first run holds a half-configured llama.cpp
          # (that run's failed configure); a new key leaves it behind. Bump it again
          # if a cache is ever saved in a bad state.
          key: ${{ runner.os == 'Windows' && 'windows-2' || '' }}
          # llama.cpp is slow to build, and failed runs are likely for a while.
          cache-on-failure: true

      # The app downloads this on request, from a release asset of this
      # version; the installer is built with the archive's checksum so that it
      # knows what to accept (no checksum, no CUDA offer: macOS has none, and
      # neither has a build whose CUDA job failed).
      - name: Get the CUDA backend checksum
        if: matrix.cuda-os != '' && needs.cuda-backend.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: cuda-backend-${{ matrix.cuda-os }}
          path: cuda-backend

      - name: Pass the CUDA backend checksum to the build
        if: matrix.cuda-os != '' && needs.cuda-backend.result == 'success'
        shell: bash
        run: echo "CUDA_BACKEND_SHA256=$(tr -d '[:space:]' < cuda-backend/cuda-backend-${{ matrix.cuda-os }}-x64.zip.sha256)" >> "$GITHUB_ENV"

      # The WSL screenshot helper, a separate Windows program that the Linux
      # installer bundles (tauri.bundle.linux.conf.json).
      - name: Build screenshot.exe (Linux cross-compile)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path src-screenshot/Cargo.toml
          mkdir -p src-tauri/resources
          cp src-screenshot/target/x86_64-pc-windows-gnu/release/screenshot.exe src-tauri/resources/screenshot.exe

      - name: Upload screenshot.exe artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-exe
          path: src-tauri/resources/screenshot.exe

      # Copy model.glb / model.yaml into resources/ if present in the repo.
      # Models are not committed at the moment; set up dummies if so.
      # Animations are copied if present (also not committed).
      - name: Copy model files into resources (if present)
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          if [ -f models/model.glb ] && [ -f models/model.yaml ]; then
            cp models/model.glb models/model.yaml src-tauri/resources/models/
          else
            touch src-tauri/resources/models/model.glb
            touch src-tauri/resources/models/model.yaml
          fi
          mkdir -p src-tauri/resources/models/animations
          if [ -d models/animations ]; then
            find models/animations -maxdepth 1 -name '*.vrma' \
              -exec cp {} src-tauri/resources/models/animations/ \;
          fi
          # Ensure the animations glob in tauri.bundle.conf.json always matches
          # at least one file, even when no .vrma files are present.
          if [ -z "$(ls src-tauri/resources/models/animations/)" ]; then
            touch src-tauri/resources/models/animations/placeholder
          fi

      # Cache the cargo-tauri binary so it is only compiled on first run.
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-cargo-tauri-2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # tauri.bundle.conf.json adds what only installers need: the models, the
      # kokoro-espeak sidecar (its beforeBuildCommand builds it, with
      # espeak-ng-data) and the licences. On Linux, tauri.bundle.linux.conf.json
      # adds the WSL screenshot helper built above; only installers bundle it, so
      # other Linux builds (the CUDA backend job, `cargo test`) don't need it.
      # The first Vulkan build of llama.cpp on Windows often fails on a race in
      # its shader generator (vulkan-shaders-gen); a rerun gets further, so try
      # up to three times.
      # NO_STRIP: linuxdeploy (AppImage) bundles the system libraries, and its
      # old `strip` can't read the .relr.dyn sections that Ubuntu 24.04's
      # libraries have, which fails the AppImage with "failed to run linuxdeploy".
      - name: Build the installer
        shell: bash
        env:
          NO_STRIP: "true"
        run: |
          configs=(--config src-tauri/tauri.bundle.conf.json)
          if [ "$RUNNER_OS" = "Linux" ]; then
            # --verbose shows linuxdeploy's own output, which tauri hides otherwise.
            configs+=(--config src-tauri/tauri.bundle.linux.conf.json --verbose)
          fi
          build_dir="${CARGO_BUILD_BUILD_DIR:-target}"
          build_dir="${build_dir//\\//}"
          for attempt in 1 2 3; do
            if cargo tauri build --features "${{ matrix.features }}" "${configs[@]}"; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            # The cmake crate skips configuring when CMakeCache.txt exists, so after
            # a failed configure every retry would fail with "install.vcxproj does
            # not exist". Reconfiguring is cheap; compiled objects are kept.
            rm -f "$build_dir"/release/build/llama-cpp-sys-2-*/out/build/CMakeCache.txt
          done
          exit 1

      # Only the GPU backend of the platform may be in the installer: Vulkan on
      # Windows and Linux, Metal on macOS, never CUDA (that is the separate
      # download). build.rs stages the libraries that the installer bundles here.
      # Metal has no cargo feature of its own that does anything: llama.cpp builds
      # it by default on Apple targets, so check that it is there.
      - name: Check the GPU backend in the installer's libraries
        shell: bash
        run: |
          ls -l src-tauri/resources/llama/backends
          if ! ls src-tauri/resources/llama/backends | grep -qi "ggml-${{ matrix.gpu-backend }}"; then
            echo "::error::no ${{ matrix.gpu-backend }} backend library was built"
            exit 1
          fi
          if ls src-tauri/resources/llama | grep -qi cuda || ls src-tauri/resources/llama/backends | grep -qi cuda; then
            echo "::error::a CUDA library ended up in the installer"
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # A draft release with the CUDA archives, for the app to download from:
  # https://github.com/<repository>/releases/download/<tag>/cuda-backend-<os>-x64.zip
  # Publish the draft once the installers have been tried.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cuda-backend, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cuda-backend-*
          path: cuda-backend
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: cuda-backend/*
