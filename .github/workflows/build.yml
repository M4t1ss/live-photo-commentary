name: Build

on:
  push:
    branches: [tauri, main]
  pull_request:
    branches: [tauri, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            uv-asset: uv-x86_64-pc-windows-msvc.zip
            uv-resource: uv-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-22.04
            uv-asset: uv-x86_64-unknown-linux-gnu.tar.gz
            uv-resource: uv-x86_64-unknown-linux-gnu
          - platform: macos-latest
            uv-asset: uv-aarch64-apple-darwin.tar.gz
            uv-resource: uv-aarch64-apple-darwin
          # - platform: macos-13
          #   uv-asset: uv-x86_64-apple-darwin.tar.gz
          #   uv-resource: uv-x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # UPGRADED: v4 -> v5 removes Node 20 dependency
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            gcc-mingw-w64-x86-64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-screenshot -> target

      # Download the uv binary for this platform and place it in
      # src-tauri/resources/ so it can be bundled via --config below.
      - name: Download uv binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/resources
          curl -fsSL \
            "https://github.com/astral-sh/uv/releases/latest/download/${{ matrix.uv-asset }}" \
            | tar xz --strip-components=1 -C /tmp
          mv /tmp/uv "src-tauri/resources/${{ matrix.uv-resource }}"
          chmod +x "src-tauri/resources/${{ matrix.uv-resource }}"

      - name: Download uv binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources
          $url = "https://github.com/astral-sh/uv/releases/latest/download/${{ matrix.uv-asset }}"
          Invoke-WebRequest $url -OutFile "$env:TEMP\uv.zip"
          Expand-Archive "$env:TEMP\uv.zip" -DestinationPath "$env:TEMP\uv-dist"
          Copy-Item "$env:TEMP\uv-dist\uv.exe" "src-tauri/resources/${{ matrix.uv-resource }}"

      # Copy Python source into resources/ so the bundler can include it.
      # shell: bash works on all three platforms in GitHub Actions.
      - name: Copy backend source into resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/backend
          cp -r backend/live_photo_commentary src-tauri/resources/backend/
          cp backend/pyproject.toml backend/uv.lock src-tauri/resources/backend/

      # pyopenjtalk has no PyPI wheels on any platform. Build a platform-native
      # wheel here and wire it into the bundled pyproject.toml as a local
      # [tool.uv.sources] path, then regenerate the lock file so uv sync on
      # the end-user's machine resolves it from vendor/ instead of PyPI.
      # (uv sync ignores --find-links for packages already pinned in the lock.)
      - name: Build pyopenjtalk wheel and wire into bundled pyproject.toml
        shell: bash
        run: |
          pip install uv
          PYOJTALK_VER=$(python3 -c "import re,sys; m=re.search(r'name = \"pyopenjtalk\"\nversion = \"([^\"]+)\"', open('backend/uv.lock').read()); print(m.group(1) if m else sys.exit(1))")
          echo "Building pyopenjtalk==$PYOJTALK_VER"
          mkdir -p src-tauri/resources/backend/vendor
          uv venv --python 3.12 --seed /tmp/lpc-build-venv
          BUILD_PYTHON=/tmp/lpc-build-venv/bin/python
          [ -f /tmp/lpc-build-venv/Scripts/python.exe ] && BUILD_PYTHON=/tmp/lpc-build-venv/Scripts/python.exe
          "$BUILD_PYTHON" -m pip wheel \
            "pyopenjtalk==$PYOJTALK_VER" \
            --no-deps --no-cache-dir --wheel-dir src-tauri/resources/backend/vendor/
          python3 tools/patch_pyopenjtalk.py src-tauri/resources/backend
          cd src-tauri/resources/backend && uv lock --python 3.12
          echo "vendor:" && ls vendor/

      - name: Build screenshot.exe (Linux cross-compile)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path src-screenshot/Cargo.toml
          cp src-screenshot/target/x86_64-pc-windows-gnu/release/screenshot.exe src-tauri/resources/screenshot.exe

      # UPGRADED: v4 -> v5 removes Node 20 dependency
      - name: Upload screenshot.exe artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-exe
          path: src-tauri/resources/screenshot.exe

      # Copy model.glb / model.yaml into resources/ if present in the repo.
      # Models are not committed at the moment; set up dummies if so.
      # Animations are copied if present (also not committed).
      - name: Copy model files into resources (if present)
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          if [ -f models/model.glb ] && [ -f models/model.yaml ]; then
            cp models/model.glb models/model.yaml src-tauri/resources/models/
          else
            touch src-tauri/resources/models/model.glb
            touch src-tauri/resources/models/model.yaml
          fi
          mkdir -p src-tauri/resources/models/animations
          if [ -d models/animations ]; then
            find models/animations -maxdepth 1 -name '*.vrma' \
              -exec cp {} src-tauri/resources/models/animations/ \;
          fi
          # Ensure the animations glob in tauri.bundle.conf.json always matches
          # at least one file, even when no .vrma files are present.
          if [ -z "$(ls src-tauri/resources/models/animations/)" ]; then
            touch src-tauri/resources/models/animations/placeholder
          fi

      # Cache the cargo-tauri binary so it is only compiled on first run.
      # UPGRADED: v4 -> v5 removes Node 20 dependency
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ runner.os }}-cargo-tauri-2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # Build the Tauri app.
      # --config injects the resources array only for production builds;
      # the base tauri.conf.json has an empty resources list so dev builds
      # don't require the binary to be present. Linux gets its own overlay
      # since screenshot.exe (WSL screenshot fallback) is only built there.
      - name: Select bundle config
        id: bundle-config
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "path=src-tauri/tauri.bundle.linux.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=src-tauri/tauri.bundle.conf.json" >> "$GITHUB_OUTPUT"
          fi

      # UPGRADED: @v0 pinned to latest release to leverage Node 24 support
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: cargo tauri
          args: --config ${{ steps.bundle-config.outputs.path }}

      # UPGRADED: v4 -> v5 removes Node 20 dependency
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
