[package]
name = "app"
version = "0.2.0"
description = "Interactive Live Commentary Assistant desktop app"
authors = ["Goran Topic", "Matiss Rikters"]
license = "MIT"
repository = "https://github.com/M4t1ss/live-photo-commentary"
edition = "2021"
# hf-hub (through kokoro-timestamped) pulls in sysinfo, which needs 1.95.
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["tauri/devtools"]
# GPU backends for local models (see vlm-describer's README). Build with
# `dynamic-backends` plus the GPU backends of the platform to load them at run
# time (what the installer does); without it they are built in.
dynamic-backends = ["vlm-describer/dynamic-backends"]
vulkan = ["vlm-describer/vulkan"]
metal = ["vlm-describer/metal"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tauri = { version = "2.11.2", features = [] }
tauri = { version = "2.11.2", features = ["devtools", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", features = ["json"] }
xcap = "0.9"
image = "0.25"
base64 = "0.22"
tokio = { version = "1", features = ["time", "rt", "macros", "fs", "io-util"] }
kokoro-timestamped = { path = "../crates/kokoro-timestamped" }
vlm-describer = { path = "../crates/vlm-describer", features = ["llama-cpp"] }
# Only for build.rs: as a direct dependent of this crate (its `links = "llama"`),
# build.rs learns where llama.cpp's libraries were built. Keep the version
# equal to the one vlm-describer's llama-cpp-2 uses (see vlm-describer's CLAUDE.md).
llama-cpp-sys-2 = "=0.1.158"
serde_yaml_ng = "0.10"
hound = "3.5"
tauri-plugin-opener = "2"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_LibraryLoader"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus = "0.9"

[dev-dependencies]
wiremock = "0.6"
