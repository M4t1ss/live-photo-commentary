# VLM model catalogue, embedded in the app (src-tauri/src/catalogue.rs).
#
# Each provider section lists available models. Entries can be a plain string
# (model name/ID) or an object:
#
#   - name: org/model-id                  # what the "Model" setting stores
#     display_name: Human-readable label  # optional, defaults to name
#     generation_kwargs:                  # optional: max_new_tokens, temperature, top_p, top_k
#       max_new_tokens: 150
#     response_re: '...'                  # optional, picks 'text' group or 1st group from response
#
# Local entries run on llama.cpp and also need the GGUF files on Hugging Face:
#
#     gguf_repo: owner/repo               # the repository with the files below
#     model_file: model-Q4_K_M.gguf
#     mmproj_file: mmproj-model.gguf      # the vision projector
#
# `name` stays the original model's Hugging Face ID, so settings saved by the
# Python version keep working. Quantisation: Q8_0 for models whose file stays
# under about 4.5 GB, a 4-bit one (Q4_K_M, or Q4_0 where that is all there is)
# above that.
#
# The "Model overrides (JSON)" setting can change generation_kwargs and
# response_re, and gguf_repo, model_file and mmproj_file (which is how to use a
# model that is not listed here).
#
# Cloud
gemini:
  - gemini-3.6-flash
  - gemini-3.5-flash
  - gemini-3.5-flash-lite
  - gemini-3.1-flash-lite
openai:
  - gpt-4o
  - gpt-4o-mini

# Local
